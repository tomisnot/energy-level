<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Re0 机甲驾驶舱 · 只读投影</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶栏：精简标题 + 合并状态条（靠左/中，避开右上角被对话窗遮挡的区域） -->
  <header id="top">
    <div class="brand">
      <span class="logo">◈</span>
      <h1>驾驶舱</h1>
    </div>
    <div class="hud-strip">
      <span id="light-alert" class="light ok" title="告警灯（例外驱动）">
        <span class="dot"></span><span class="lbl">平静</span>
      </span>
      <span id="light-conn" class="light ok" title="连接/存活">
        <span class="dot"></span><span class="lbl">连接中</span>
      </span>
      <span class="chip" title="引擎 method">method <b id="hud-method">—</b></span>
      <span class="chip" title="在跑什么">run <b id="hud-running">—</b></span>
      <span class="chip" title="运行次数">#<b id="hud-nruns">0</b></span>
      <span class="chip" title="事件总线进度（append-only journal）">seq <b id="last-seq">0</b> · <span id="n-events">0 事件</span></span>
    </div>
  </header>

  <main>
    <!-- 两页签：飞行记录仪(默认) / 配置态 -->
    <nav class="tabs" id="cockpit-tabs">
      <button class="tab active" data-tab="recorder">飞行记录仪</button>
      <button class="tab" data-tab="config">配置态</button>
    </nav>

    <!-- 飞行记录仪（核心，默认页）：全宽 + 逐行折叠；折叠=概括，展开=全量多行 -->
    <section id="recorder" class="panel wide tab-page active">
      <div class="controls">
        <input id="filter" type="search" placeholder="过滤 actor/kind/reason…" />
        <label><input id="ai-only" type="checkbox" /> 只看 AI</label>
        <button id="reload">重读</button>
      </div>
      <div id="events" class="recorder-list"></div>
    </section>

    <!-- 配置态结构树：窄名称栏 + 值列(hover 看全量)，省略解释列 -->
    <section id="config-tree" class="panel wide tab-page">
      <div class="controls">
        <input id="tree-filter" type="search" placeholder="过滤键…" />
        <label><input id="tree-show-engine" type="checkbox" /> engine</label>
        <button id="tree-reload">重读</button>
        <span id="tree-meta" class="muted"></span>
      </div>
      <div id="tree-body"></div>
    </section>
  </main>

  <!-- 告警：角落折叠徽标（不占行/列），点击弹出列表 -->
  <button id="alert-badge" class="alert-badge ok" title="告警（点击展开/收起）">
    <span class="dot"></span><span id="alert-count">0</span>
  </button>
  <div id="alert-pop" class="alert-pop" hidden>
    <ul id="alert-list" class="alerts"></ul>
    <p class="muted" id="alerts-empty">默认平静——无异常。</p>
  </div>

  <footer class="muted">
    驾驶舱是<b>只读</b>投影：无写回项目的通道（I2）。远程访问须鉴权；写端点（MCP）
    永不出本机（T6）。数据源 = append-only journal，项目崩溃后仍显示死前全貌（T5）。
  </footer>

  <script src="app.js"></script>
</body>
</html>
