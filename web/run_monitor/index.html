<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f3f6fa"><meta name="color-scheme" content="light"><title>EL · 运行观察</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app-shell">
<aside class="sidebar"><div class="brand"><span class="brand-symbol">EL</span><div>ENERGY LEVEL<small>运行观察 · 人类只读</small></div></div><div class="connection" id="connection" role="status">正在连接计算服务</div><nav><button class="nav active" data-page="runs">运行卡片 <span id="run-count">0</span></button><button class="nav" data-page="config">当前配置</button></nav><div id="history" class="history" aria-label="运行历史"></div><div class="sidebar-bottom">配置 → 计算 → 结果<br><span>每次运行，一张卡片</span></div></aside>
<main><header class="toolbar"><div class="filters" role="group" aria-label="筛选运行"><button class="active" data-filter="all">全部</button><button data-filter="running">计算中</button><button data-filter="completed">已完成</button><button data-filter="attention">需关注</button></div><input id="search" type="search" aria-label="搜索运行" placeholder="搜索运行或方法"><span class="read-only">只读观察</span></header><div class="deck-header"><span id="deck-hint">最新运行在前 · 滚轮 / ↑ ↓ 翻页</span><div><button id="prev" aria-label="上一张卡片">↑</button><span id="position">0 / 0</span><button id="next" aria-label="下一张卡片">↓</button></div></div><section class="deck-stage" id="stage" aria-label="运行卡片"><div class="back-card back-two"></div><div class="back-card back-one"></div><div id="card-host"></div></section><footer><span>ENERGY LEVEL / RUN OBSERVER</span><span id="sync">等待真实运行</span></footer></main></div><script type="module" src="app.js"></script></body></html>
