# 项目实例隔离 overlay（launcher 经 `--patch` 加载，组合链**最后一层**）
#
# 唯一职责：还原 webserver 的端口表达式，让 `--port` 生效（机制详见
# mecha-sdk《DSH-实例并存原理》§3）。
#
# profile 补丁（`~/.dsh/profiles/web/cordis.patch.yml`）把 webserver 的 `port`
# 钉成字面量 3080。同 id 的 patch 是**整块替换** config，不是深合并，故本 overlay
# 作为最后一层把整块照抄回来、只把 host/port 换成 `!!js` 表达式（compression 三件
# 一并照抄）。还原后 `--port` 重新生效 ⇒ launcher 能把项目实例绑到 3081+，
# 把 :3080 让给官方 dsh。
#
# 已撤（2026-09-24）：原先还有一条 `- id: remote-web-ui / disabled: true`，用来阻止
# 该插件的托管块把实际端口**回写**进共享 profile。该插件已于 2026-09-24 从 profile
# 移除（0.1.7 起设置层改为 Profile 插件配置，其依赖的 settingsScope 服务不复存在），
# 该条遂成悬空目标——dsh 0.1.7 实测报 `patch: entry "remote-web-ui" not found`
# （仅 stderr 告警、退出码 0，非致命）。现删除；删除理由随之消失，webserver 块
# 改由本 overlay 单独负责。
#
# 效果：项目实例与官方 dsh **并存**，使用者零额外操作。
# ⚠ name 必须与目标行一致（cordis-plugin-include 对 name 不匹配的 patch 跳过并告警）。

# 还原 webserver 端口表达式（让 --port 生效）
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  inject: [webStartup]
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
